# CI of the app: builds and tests the Release profile, the Kazo OS packages from nuget.org at the
# version of the submodule (ADR 0176 §4, §6). This is what the Kazo OS Store compiles.
# The steps live in the reusable workflow kazoos-ci.yml of Kazo-ca/Os-AppTemplate (ADR 0271 §7).
# It fetches only the Kazo OS submodule: the app uses the FigCraft build committed in
# src/Kazo.Fig/wwwroot/figcraft/, so external/figcraft is not needed.
#
# workflow_call: the Build FigCraft workflow (build-figcraft.yml) calls it on the branch it pushes,
# since a push made with the workflow token starts no workflow.
name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Branch to check out and test
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: "ci-${{ inputs.ref || github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    uses: Kazo-ca/Os-AppTemplate/.github/workflows/kazoos-ci.yml@v1
    with:
      ref: ${{ inputs.ref || '' }}
